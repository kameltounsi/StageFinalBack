<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <style>
        body{font-family: Arial, Helvetica, sans-serif; font-size:12px; color:#222;}
        h1{color:#c00; text-align:center; margin:0 0 8px}
        .meta{ text-align:center; margin-bottom:14px; color:#555}
        table{width:100%; border-collapse:collapse; table-layout:fixed}
        th, td{border:1px solid #ccc; padding:6px; vertical-align:top}
        th{background:#f6f6f6; font-weight:700}
        .day-col{width:16.6%}
        .slot{margin:4px 0; padding:6px; border-radius:6px; background:#fafafa;}
        .slot strong{display:block; margin-bottom:2px}
        .time{color:#444; font-size:11px}
        .salle{color:#0a7; font-size:11px}
        .trainer{color:#777; font-size:11px}
        .pause{background:#f3f3f3; text-align:center; color:#666}
        .footer{margin-top:8px; text-align:right; font-size:10px; color:#777}
    </style>
</head>
<body>
<h1>Emploi du Temps</h1>
<div class="meta">
    <div th:text="${groupeNom}">WD A</div>
    <div th:text="${specialite}">Web Development</div>
    <div th:text="'Semaine : ' + ${startDate} + ' → ' + ${endDate}">2025-08-11 → 2025-08-16</div>
</div>

<table>
    <thead>
    <tr>
        <th class="day-col" th:each="d : ${jours}" th:text="${d.label}">Lundi<br/>11/08</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td class="day-col" th:each="d : ${jours}">
            <div th:if="${#lists.isEmpty(d.seances)}" class="slot pause">— Aucune séance —</div>
            <div class="slot" th:each="s : ${d.seances}">
                <strong th:text="${s.matiere}">Frontend</strong>
                <div class="time" th:text="${s.heureDebut} + ' — ' + ${s.heureFin}">10:00 — 12:00</div>
                <div class="salle" th:text="'Salle : ' + ${s.salle}">S201</div>
                <div class="trainer" th:text="'Formateur : ' + ${s.formateurNom}">Mohamed Kamel</div>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<div class="footer" th:text="${generatedAt}">Généré le …</div>
</body>
</html>
